<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confidential Questionnaire | JD Strategic Franchising</title>
<meta name="description" content="The questions Josh DuBois would ask on the call, answered first. One question at a time, saved as you go, completely confidential.">
<meta name="theme-color" content="#0A1D3A">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,opsz,wght@0,5..1200,400..800;1,5..1200,400..700&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   JD STRATEGIC — CONFIDENTIAL QUESTIONNAIRE
   One question per screen. The journey pattern is the house one measured from
   builds/mmi-money-type-quiz-funnel: fixed topbar + progress, centred question
   card, stacked option buttons with a fill-on-select indicator, disabled-until-
   answered advance. Skin is jd-strategic-site: Playfair + Inter, navy ink,
   0 radius, hairline rules, orange rationed.

   ACCENT RAMP — the one deliberate deviation from the site's own CSS.
   #FF6A00 measures 2.87:1 on white, so it is illegal for text at any size.
   The site ships that on .eyebrow.gold and .num; it is not replicated here.
     --accent      #FF6A00  non-text only: fills, bars, rules, focus, marks
     --accent-deep #E55F00  3.5:1 — accent text 24px and up
     --accent-ink  #C94E00  4.6:1 — accent text below 24px
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#0A1D3A;
  --ink-deep:#061020;
  --body:#5A6B7E;
  --muted:#6E7F92;
  --faint:#AEB9C6;
  --hairline:#E4E8ED;
  --hairline-2:#EFF2F5;
  --canvas:#FFFFFF;
  --cream:#FAF9F7;
  --accent:#FF6A00;
  --accent-deep:#E55F00;
  --accent-ink:#C94E00;
  --accent-wash:rgba(255,106,0,.07);

  --fd:'Playfair Display',Georgia,'Times New Roman',serif;
  --fb:'Inter',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --top-h:66px;
  --gut:clamp(22px,5vw,40px);
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--cream);color:var(--body);
  font-family:var(--fb);font-size:17px;line-height:1.62;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-optical-sizing:auto;
  font-feature-settings:'cv05' 1,'cv08' 1,'cv11' 1,'ss03' 1;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
body.scrollable{overflow:auto}
h1,h2,h3{margin:0;font-family:var(--fd);color:var(--ink);font-weight:700;line-height:1.06;letter-spacing:-.014em;font-optical-sizing:auto;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:rgba(255,106,0,.16);color:var(--ink)}

/* ==========================================================================
   TOPBAR + PROGRESS
   ========================================================================== */
.top{
  position:fixed;top:0;left:0;right:0;z-index:60;height:var(--top-h);
  background:var(--ink);display:flex;align-items:center;
  padding-inline:clamp(18px,3.2vw,34px);gap:clamp(16px,3vw,38px);
}
.top .brand{display:inline-flex;align-items:center;gap:10px;flex:none;text-decoration:none}
.top .mark{width:30px;height:30px;border:1px solid rgba(255,255,255,.42);display:grid;place-items:center;color:#fff;font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.04em}
.top .wm{display:flex;flex-direction:column;line-height:1}
.top .wm b{font-family:var(--fd);font-size:14.5px;font-weight:700;color:#fff}
.top .wm span{font-size:8px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:5px}
.top .ct{margin-left:auto;display:flex;align-items:center;gap:clamp(12px,2vw,22px);flex:none}
.counter{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums;white-space:nowrap}
.saved{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:0;transition:opacity .45s ease;white-space:nowrap}
.saved.on{opacity:1}
.saved svg{width:12px;height:12px}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .65s var(--ease)}

/* ==========================================================================
   STAGE — one screen at a time, vertically centred
   ========================================================================== */
.stage{
  position:fixed;top:var(--top-h);left:0;right:0;bottom:0;
  overflow-y:auto;overflow-x:hidden;
  display:flex;align-items:center;
  padding:clamp(28px,5vh,64px) var(--gut) clamp(96px,14vh,132px);
}
.card{width:100%;max-width:720px;margin:0 auto}
.card.in{animation:cardIn .52s var(--ease) both}
.card.in.rev{animation-name:cardInRev}
@keyframes cardIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes cardInRev{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}

/* ---------- question head ---------- */
.chip{
  display:inline-flex;align-items:center;gap:9px;margin-bottom:24px;
  padding:8px 13px;border:1px solid rgba(201,78,0,.3);background:var(--accent-wash);
  font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink);
}
.chip i{width:5px;height:5px;background:var(--accent);flex:none;display:block}
.qn{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qn b{font-family:var(--fb);font-size:12.5px;font-weight:700;letter-spacing:.18em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.qn svg{width:13px;height:13px;color:var(--accent-ink)}
.qt{font-family:var(--fd);font-size:clamp(25px,3.5vw,40px);font-weight:700;line-height:1.14;letter-spacing:-.016em;color:var(--ink);text-wrap:pretty}
.qt .it{font-style:italic;color:var(--accent-deep);font-weight:600}
.qh{margin-top:16px;font-size:15.5px;line-height:1.62;color:var(--muted);max-width:56ch;text-wrap:pretty}
.qb{margin-top:clamp(28px,4vh,42px)}

/* ---------- open fields: underline, never a box ---------- */
.fin{
  width:100%;border:0;border-bottom:1.5px solid var(--hairline);background:transparent;
  font-size:clamp(19px,2.1vw,25px);line-height:1.5;color:var(--ink);
  padding:10px 2px 13px;border-radius:0;-webkit-appearance:none;appearance:none;
  transition:border-color .28s var(--ease);
}
.fin::placeholder{color:var(--faint)}
.fin:hover{border-bottom-color:#C6D0DB}
.fin:focus{outline:none;border-bottom-color:var(--ink);box-shadow:0 1.5px 0 0 var(--ink)}
textarea.fin{resize:none;overflow:hidden;min-height:78px;line-height:1.5}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 30px}
.pl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.bad .fin{border-bottom-color:var(--accent-ink);box-shadow:0 1.5px 0 0 var(--accent-ink)}
.err{display:none;margin-top:12px;font-size:14px;font-weight:600;color:var(--accent-ink)}
.bad .err{display:block}

/* ---------- option buttons ---------- */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:17px 46px 17px 17px;background:var(--canvas);border:1px solid var(--hairline);
  font-size:16px;line-height:1.45;color:var(--ink);
  transition:border-color .34s var(--ease),transform .34s var(--ease),background .34s var(--ease),color .34s var(--ease);
}
.opt .k{
  width:28px;height:28px;flex:none;display:grid;place-items:center;
  border:1px solid var(--hairline);font-size:11.5px;font-weight:700;letter-spacing:.04em;
  color:var(--muted);font-variant-numeric:tabular-nums;
  transition:border-color .34s var(--ease),background .34s var(--ease),color .34s var(--ease);
}
.opt .tick{
  position:absolute;right:16px;top:50%;transform:translateY(-50%) scale(.5);opacity:0;
  width:19px;height:19px;color:var(--accent);
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
.opt:hover{transform:translateX(3px);border-color:var(--ink)}
.opt:hover .k{border-color:var(--ink);color:var(--ink)}
.opt.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.sel .tick{opacity:1;transform:translateY(-50%) scale(1)}
.opt.sel:hover{transform:translateX(3px)}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.opts.grid .opt{padding:15px 40px 15px 15px;font-size:15px;gap:13px}
.opts.grid .opt .k{width:25px;height:25px;font-size:11px}

/* ---------- 1–5 scale ---------- */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:520px}
.sc{
  position:relative;display:grid;place-items:center;height:clamp(64px,9vh,84px);
  background:var(--canvas);border:1px solid var(--hairline);
  font-family:var(--fd);font-size:23px;font-weight:700;color:var(--faint);
  font-variant-numeric:lining-nums;
  transition:border-color .3s var(--ease),background .3s var(--ease),color .3s var(--ease),transform .3s var(--ease);
}
.sc:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-3px)}
.sc.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.sclab{display:flex;justify-content:space-between;max-width:520px;margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

/* ---------- advance row ---------- */
.go{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:clamp(30px,4.5vh,46px)}
.btn{
  display:inline-flex;align-items:center;gap:22px;
  font-size:13px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  padding:18px 26px;border:1px solid transparent;
  transition:background .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),opacity .3s var(--ease);
}
.btn svg{width:16px;height:16px;flex:none;transition:transform .34s var(--ease)}
.btn:hover svg{transform:translateX(5px)}
.btn-solid{background:var(--ink);color:#fff}
.btn-solid svg{color:var(--accent)}
.btn-solid:hover{background:var(--ink-deep)}
.btn-solid:disabled{opacity:.3;cursor:not-allowed}
.btn-solid:disabled:hover{background:var(--ink)}
.btn-solid:disabled:hover svg{transform:none}
.btn-ghost{border-color:var(--ink);color:var(--ink)}
.btn-ghost svg{color:var(--accent-ink)}
.btn-ghost:hover{background:var(--ink);color:#fff}
.btn-ghost:hover svg{color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.hint kbd{
  font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  border:1px solid var(--hairline);background:var(--canvas);padding:4px 7px;color:var(--ink);
}
@media (hover:none){.hint{display:none}}

/* ---------- chapter card ---------- */
.chap .ghost{
  font-family:var(--fd);font-size:clamp(72px,12vw,140px);font-weight:700;line-height:1;
  color:var(--hairline);letter-spacing:-.04em;font-variant-numeric:lining-nums;
  display:block;margin-bottom:20px;
}
.chap .lab{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:16px;display:block}
.chap h2{font-size:clamp(31px,4.6vw,54px);line-height:1.06}
.chap .rule{width:64px;height:3px;background:var(--accent);margin:26px 0}
.chap p{font-size:clamp(16px,1.4vw,18.5px);line-height:1.66;color:var(--body);max-width:52ch;text-wrap:pretty}

/* ---------- welcome + review ---------- */
.meta{display:flex;flex-wrap:wrap;margin-top:38px;border-top:1px solid var(--hairline)}
.meta div{padding:18px clamp(16px,2.4vw,30px) 0 0;margin-right:clamp(16px,2.4vw,30px);border-right:1px solid var(--hairline)}
.meta div:last-child{border-right:0;margin-right:0;padding-right:0}
.meta .k{display:block;font-family:var(--fd);font-size:21px;font-weight:700;color:var(--ink);line-height:1;font-variant-numeric:lining-nums}
.meta .v{display:block;font-size:9.5px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);margin-top:9px}
.rev{border:1px solid var(--hairline);background:var(--canvas);max-height:min(42vh,400px);overflow-y:auto;padding:6px 22px}
.rev h4{font-family:var(--fb);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink);margin:22px 0 10px;padding-bottom:9px;border-bottom:1px solid var(--ink)}
.rev .r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;padding:9px 0;border-bottom:1px solid var(--hairline-2);font-size:13.5px;line-height:1.5}
.rev .r:last-child{border-bottom:0}
.rev .r .k{color:var(--muted)}
.rev .r .v{color:var(--ink);white-space:pre-wrap}
.rev .none{padding:18px 0;font-size:14px;color:var(--muted)}
.edit{background:none;border:0;color:var(--accent-ink);font-size:12px;font-weight:700;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px;padding:0;margin-left:8px;cursor:pointer}

/* ---------- footer controls ---------- */
.ctrl{
  position:fixed;right:var(--gut);bottom:clamp(20px,3.4vh,30px);z-index:55;
  display:flex;gap:1px;
}
.ctrl button{
  width:44px;height:40px;display:grid;place-items:center;
  background:var(--canvas);border:1px solid var(--hairline);color:var(--ink);
  transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),opacity .25s ease;
}
.ctrl button:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:#fff}
.ctrl button:disabled{opacity:.34;cursor:not-allowed}
.ctrl svg{width:15px;height:15px}
.legal{
  position:fixed;left:var(--gut);bottom:clamp(20px,3.4vh,30px);z-index:55;
  font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:14px;
}
.legal button{font-size:11.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.legal button:hover{color:var(--accent-ink)}
@media (max-width:700px){.legal span{display:none}}

/* ---------- done ---------- */
.done{
  position:fixed;inset:0;z-index:70;background:var(--ink);color:rgba(255,255,255,.72);
  display:none;align-items:center;overflow-y:auto;padding:clamp(40px,8vh,90px) var(--gut);
}
.done.on{display:flex}
.done-in{max-width:640px;margin:0 auto;width:100%}
.done .mark{width:60px;height:60px;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);margin-bottom:32px}
.done .mark svg{width:25px;height:25px}
.done h2{color:#fff;font-size:clamp(33px,5vw,58px);line-height:1.05}
.done h2 .it{font-style:italic;color:var(--accent);font-weight:600}
.done p{color:rgba(255,255,255,.7);font-size:clamp(16px,1.4vw,18.5px);line-height:1.66;margin-top:24px;max-width:50ch;text-wrap:pretty}
.done .acts{display:flex;flex-wrap:wrap;gap:11px;margin-top:38px}
.done .btn-light{background:#fff;color:var(--ink)}
.done .btn-light svg{color:var(--accent-ink)}
.done .btn-out{border-color:rgba(255,255,255,.34);color:#fff}
.done .btn-out svg{color:var(--accent)}
.done .btn-out:hover{background:#fff;color:var(--ink)}

/* ---------- print ---------- */
.psum{display:none}
@media print{
  .top,.stage,.ctrl,.legal,.done .mark,.done h2,.done p,.done .acts{display:none!important}
  .done{position:static;display:block!important;background:#fff!important;color:#111!important;padding:0!important}
  .psum{display:block!important;color:#111}
  .psum h1{font-size:26px;font-family:var(--fd);margin-bottom:5px}
  .psum .sub{font-size:11.5px;color:#555;margin-bottom:24px}
  .psum h2{font-size:12px;font-family:var(--fb);letter-spacing:.16em;text-transform:uppercase;border-bottom:1.5px solid #111;padding-bottom:5px;margin:22px 0 10px;color:#111}
  .psum .r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px;padding:6px 0;border-bottom:1px solid #E4E8ED;font-size:11.5px;line-height:1.5;break-inside:avoid}
  .psum .r .k{font-weight:600;color:#111}
  .psum .r .v{color:#333;white-space:pre-wrap}
  body{overflow:visible}
  @page{margin:15mm}
}

/* ---------- responsive ---------- */
@media (max-width:640px){
  :root{--top-h:60px}
  .top .wm{display:none}
  .pair{grid-template-columns:minmax(0,1fr);gap:22px}
  .opts.grid{grid-template-columns:minmax(0,1fr)}
  .scale{gap:7px;max-width:none}
  .sc{height:60px;font-size:19px}
  .go{gap:14px}
  .btn{width:100%;justify-content:space-between}
  .stage{padding-bottom:104px;align-items:flex-start}
  .meta div{width:50%;border-right:0;padding-right:0;margin-right:0;padding-bottom:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="https://javmartz04-ship-it.github.io/jd-strategic-site/" aria-label="JD Strategic Franchising, home">
    <span class="mark" aria-hidden="true">JD</span>
    <span class="wm"><b>JD Strategic</b><span>Franchising</span></span>
  </a>
  <span class="ct">
    <span class="saved" id="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 6 6L20 6"/></svg>Saved</span>
    <span class="counter" id="counter">Confidential Questionnaire</span>
  </span>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
</header>

<main class="stage" id="stage">
  <div class="card" id="card"></div>
</main>

<div class="legal">
  <span>Confidential. Josh only, never a franchisor.</span>
  <button type="button" id="clearBtn">Start over</button>
</div>

<div class="ctrl">
  <button type="button" id="prevBtn" aria-label="Previous question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></button>
  <button type="button" id="nextBtn" aria-label="Next question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
</div>

<section class="done" id="done" tabindex="-1" aria-labelledby="dn-h">
  <div class="done-in">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 6 6L20 6"/></svg></span>
    <h2 id="dn-h">Got it. <span class="it">Thank you.</span></h2>
    <p>I&rsquo;ll read this before we speak and come to the call with brands already screened against your capital, your market, and the role you actually want.</p>
    <div class="acts">
      <button type="button" class="btn btn-light" id="printBtn">Print / save a copy<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-6h16v6h-2M8 14h8v7H8z"/></svg></button>
      <a class="btn btn-out" href="https://javmartz04-ship-it.github.io/jd-strategic-site/#contact">Book the call<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </div>
  <div class="psum" id="psum"></div>
</section>

<script>
(function(){
'use strict';

/* ==========================================================================
   THE QUESTIONS
   Straight out of Josh's "Full Confidential Questionnaire.docx". Every question
   keeps its meaning and every option list is verbatim; the phrasing is opened
   up from form-label to spoken question because that is what a one-at-a-time
   journey needs. Helper text that defines a term (liquid capital, net worth)
   is the client's own wording, untouched.

   One question is NOT in the docx: "Are you married or partnered?" (chapter 1).
   It exists purely to route — a No skips the five spouse questions instead of
   walking a single person past them. Delete the screen and the four `if:`
   lines below it to go back to asking everyone.
   ========================================================================== */
var CH = ['Personal Information','Employment','Your Goals','Business Ownership',
          'A Little About Your Style','Your Strengths','Business Model Preferences',
          'Industries Of Interest','Financials','Decision Making'];

var partnered = function(a){ return a.partnered === 'Yes'; };

var S = [

{t:'welcome'},

/* ==========================================================================
   ENGINE
   ========================================================================== */
var KEY = 'jds_questionnaire_v2';
var A = {};                                   /* answers */
var idx = 0, dir = 1, advancing = false;

var card    = document.getElementById('card');
var stage   = document.getElementById('stage');
var counter = document.getElementById('counter');
var bar     = document.getElementById('bar');
var savedP  = document.getElementById('saved');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var doneEl  = document.getElementById('done');
var RM      = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LETTERS = 'ABCDEFGHIJKLMNOPQRST';
var ARROW   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

function vis(){ return S.filter(function(s){ return !s.if || s.if(A); }); }
function isQ(s){ return s.t !== 'welcome' && s.t !== 'chapter' && s.t !== 'review'; }
function qList(){ return vis().filter(isQ); }
function plain(html){ var d = document.createElement('div'); d.innerHTML = html; return d.textContent.trim(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---------- head + shell shared by every question screen ---------- */
function head(s, qi, qn){
  var h = '';
  if (s.ch) h += '<span class="chip"><i aria-hidden="true"></i>' + (s.g || CH[s.ch-1]) + '</span>';
  if (qi)   h += '<div class="qn"><b>' + String(qi).padStart(2,'0') + '</b>' +
                 '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
                 '<b style="color:var(--faint)">of ' + qn + '</b></div>';
  h += '<h2 class="qt">' + s.q + '</h2>';
  if (s.h) h += '<p class="qh">' + s.h + '</p>';
  return h;
}
function advRow(label, hint){
  return '<div class="go">' +
    '<button type="button" class="btn btn-solid" id="ok">' + (label || 'OK') + ARROW + '</button>' +
    (hint === false ? '' : '<span class="hint">press <kbd>Enter</kbd></span>') +
    '</div>';
}

/* ---------- render ---------- */
function render(){
  var list = vis(), s = list[idx], qs = qList();
  var qi = isQ(s) ? qs.indexOf(s) + 1 : 0;
  var h = '';

  if (s.t === 'welcome') {
    h = '<span class="chip"><i aria-hidden="true"></i>Confidential Questionnaire</span>' +
        '<h2 class="qt" style="font-size:clamp(32px,5vw,58px)">The questions I&rsquo;d ask on the call, <span class="it">answered first.</span></h2>' +
        '<p class="qh" style="font-size:17px;max-width:52ch">This helps me understand your goals, style, and what you&rsquo;re looking for before we talk &mdash; so our call is spent on finding the right fit, not gathering basics. Everything is confidential. Go with your gut; there are no wrong answers.</p>' +
        '<div class="meta">' +
          '<div><span class="k">' + qs.length + '</span><span class="v">Questions</span></div>' +
          '<div><span class="k">12&ndash;15</span><span class="v">Minutes</span></div>' +
          '<div><span class="k">Auto</span><span class="v">Saved as you go</span></div>' +
          '<div><span class="k">Private</span><span class="v">Josh only, never a franchisor</span></div>' +
        '</div>' +
        advRow('Begin');

  } else if (s.t === 'chapter') {
    h = '<div class="chap">' +
        '<span class="ghost" aria-hidden="true">' + String(s.ch).padStart(2,'0') + '</span>' +
        '<span class="lab">Chapter ' + s.ch + ' of 10</span>' +
        '<h2>' + CH[s.ch-1] + '</h2>' +
        '<div class="rule" aria-hidden="true"></div>' +
        '<p>' + s.body + '</p>' +
        advRow('Continue') + '</div>';

  } else if (s.t === 'review') {
    h = '<span class="chip"><i aria-hidden="true"></i>One last look</span>' +
        '<h2 class="qt">That&rsquo;s everything. <span class="it">Ready to send?</span></h2>' +
        '<p class="qh">Check anything you want to change &mdash; every line is editable. Nothing here is shared with a franchisor.</p>' +
        '<div class="qb"><div class="rev" id="rev">' + reviewHTML() + '</div></div>' +
        '<div class="go"><button type="button" class="btn btn-solid" id="ok">Send to Josh' + ARROW + '</button>' +
        '<span class="hint">You&rsquo;ll get a printable copy next</span></div>';

  } else if (s.t === 'pair') {
    h = head(s, qi, qs.length) + '<div class="qb"><div class="pair">' +
        s.f.map(function(f, k){
          return '<label><span class="pl">' + f.l + '</span>' +
                 '<input class="fin" type="' + (f.ty || 'text') + '" data-n="' + f.n + '"' +
                 (f.ac ? ' autocomplete="' + f.ac + '"' : '') +
                 ' value="' + esc(A[f.n] || '') + '"' + (k === 0 ? ' data-focus' : '') + '></label>';
        }).join('') +
        '</div></div>' + advRow();

  } else if (s.t === 'long') {
    h = head(s, qi, qs.length) + '<div class="qb">' +
        '<textarea class="fin" data-n="' + s.n + '" rows="2" data-focus placeholder="' + (s.ph || 'Type your answer&hellip;') + '">' + esc(A[s.n] || '') + '</textarea>' +
        '<span class="err">Please add an answer.</span></div>' +
        advRow('OK') .replace('press <kbd>Enter</kbd>', 'press <kbd>Enter</kbd> &nbsp;&middot;&nbsp; <kbd>Shift</kbd> + <kbd>Enter</kbd> for a new line');

  } else if (s.t === 'single') {
    h = head(s, qi, qs.length) + '<div class="qb"><div class="opts' + (s.grid ? ' grid' : '') + '" role="radiogroup">' +
        s.o.map(function(o, k){
          return '<button type="button" class="opt' + (A[s.n] === plain(o) ? ' sel' : '') + '" data-v="' + esc(plain(o)) + '" role="radio" aria-checked="' + (A[s.n] === plain(o)) + '">' +
                 '<span class="k">' + LETTERS[k] + '</span><span>' + o + '</span>' +
                 '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 6 6L20 6"/></svg></button>';
        }).join('') +
        '</div></div>' +
        '<div class="go"><span class="hint">Pick one &mdash; or press <kbd>' + LETTERS[0] + '</kbd>&ndash;<kbd>' + LETTERS[s.o.length-1] + '</kbd></span></div>';

  } else if (s.t === 'multi') {
    var chosen = A[s.n] || [];
    h = head(s, qi, qs.length) + '<div class="qb"><div class="opts' + (s.grid ? ' grid' : '') + '">' +
        s.o.map(function(o, k){
          return '<button type="button" class="opt' + (chosen.indexOf(plain(o)) > -1 ? ' sel' : '') + '" data-v="' + esc(plain(o)) + '" aria-pressed="' + (chosen.indexOf(plain(o)) > -1) + '">' +
                 '<span class="k">' + LETTERS[k] + '</span><span>' + o + '</span>' +
                 '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 6 6L20 6"/></svg></button>';
        }).join('') +
        '</div></div>' + advRow('OK');

  } else if (s.t === 'scale') {
    h = head(s, qi, qs.length) + '<div class="qb"><div class="scale" role="radiogroup">' +
        [1,2,3,4,5].map(function(v){
          return '<button type="button" class="sc' + (A[s.n] === String(v) ? ' sel' : '') + '" data-v="' + v + '" role="radio" aria-checked="' + (A[s.n] === String(v)) + '" aria-label="' + v + ' of 5">' + v + '</button>';
        }).join('') +
        '</div><div class="sclab"><span>Not really me</span><span>Definitely me</span></div></div>' +
        '<div class="go"><span class="hint">Press <kbd>1</kbd>&ndash;<kbd>5</kbd></span></div>';

  } else {
    h = head(s, qi, qs.length) + '<div class="qb">' +
        '<input class="fin" type="' + s.t + '" data-n="' + s.n + '" data-focus' +
        (s.ac ? ' autocomplete="' + s.ac + '"' : '') +
        (s.t === 'number' ? ' inputmode="numeric"' : '') +
        ' placeholder="' + (s.ph || '') + '" value="' + esc(A[s.n] || '') + '">' +
        '<span class="err">' + (s.t === 'email' ? 'That email doesn&rsquo;t look right.' : 'This one I do need.') + '</span></div>' +
        advRow();
  }

  card.className = 'card';
  void card.offsetWidth;
  card.innerHTML = h;
  card.className = 'card in' + (dir < 0 ? ' rev' : '');
  stage.scrollTop = 0;
  wire(s);
  chrome(s, qi, qs.length);
}

function chrome(s, qi, qn){
  counter.textContent = s.t === 'welcome' ? 'Confidential Questionnaire'
                      : s.t === 'chapter' ? 'Chapter ' + s.ch + ' of 10'
                      : s.t === 'review'  ? 'Review'
                      : qi + ' of ' + qn;
  var pct = s.t === 'review' ? 1 : (qi ? qi / qn : 0);
  bar.style.transform = 'scaleX(' + pct + ')';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx >= vis().length - 1;
}

/* ---------- wiring ---------- */
function wire(s){
  var ok = card.querySelector('#ok');
  if (ok) ok.addEventListener('click', function(){ next(); });

  var f = card.querySelector('[data-focus]');
  if (f && !('ontouchstart' in window)) setTimeout(function(){ f.focus({preventScroll:true}); }, RM ? 0 : 340);

  card.querySelectorAll('.fin').forEach(function(el){
    if (el.tagName === 'TEXTAREA') { grow(el); el.addEventListener('input', function(){ grow(el); }); }
    el.addEventListener('input', function(){
      A[el.dataset.n] = el.value;
      el.closest('.qb').classList.remove('bad');
      save();
    });
  });

  if (s.t === 'single') {
    card.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click', function(){ pickOne(s, b); });
    });
  }
  if (s.t === 'multi') {
    card.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click', function(){ toggle(s, b); });
    });
  }
  if (s.t === 'scale') {
    card.querySelectorAll('.sc').forEach(function(b){
      b.addEventListener('click', function(){ pickScale(s, b); });
    });
  }
  if (s.t === 'review') {
    card.querySelectorAll('.edit').forEach(function(b){
      b.addEventListener('click', function(){
        var target = vis().indexOf(S[+b.dataset.i]);
        if (target > -1) { dir = -1; idx = target; render(); }
      });
    });
  }
}
function grow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 260) + 'px'; }

function pickOne(s, b){
  card.querySelectorAll('.opt').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-checked','false'); });
  b.classList.add('sel'); b.setAttribute('aria-checked','true');
  A[s.n] = b.dataset.v; save();
  hop();
}
function pickScale(s, b){
  card.querySelectorAll('.sc').forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-checked','false'); });
  b.classList.add('sel'); b.setAttribute('aria-checked','true');
  A[s.n] = b.dataset.v; save();
  hop();
}
function toggle(s, b){
  var v = b.dataset.v, list = A[s.n] || [], at = list.indexOf(v);
  if (at > -1) list.splice(at, 1); else list.push(v);
  A[s.n] = list;
  b.classList.toggle('sel', at === -1);
  b.setAttribute('aria-pressed', String(at === -1));
  save();
}
function hop(){
  if (advancing) return;
  advancing = true;
  setTimeout(function(){ advancing = false; next(); }, RM ? 60 : 300);
}

/* ---------- movement ---------- */
function next(){
  var list = vis(), s = list[idx];
  if (isQ(s) && !valid(s)) return;
  if (s.t === 'review') { finish(); return; }
  if (idx < list.length - 1) { dir = 1; idx++; render(); save(); }
}
function prev(){ if (idx > 0) { dir = -1; idx--; render(); save(); } }

function valid(s){
  if (!s.req) return true;
  var el = card.querySelector('.fin');
  if (!el) return true;
  var v = (el.value || '').trim();
  var bad = !v || (s.t === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v));
  if (bad) { el.closest('.qb').classList.add('bad'); el.focus(); return false; }
  return true;
}

prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', function(){ next(); });

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if (doneEl.classList.contains('on')) return;
  var s = vis()[idx];
  var typing = e.target.classList && e.target.classList.contains('fin');

  if (e.key === 'Enter') {
    if (e.target.tagName === 'TEXTAREA' && e.shiftKey) return;
    e.preventDefault(); next(); return;
  }
  if (typing) return;

  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); next(); return; }
  if (e.key === 'ArrowUp'   || e.key === 'PageUp')   { e.preventDefault(); prev(); return; }

  if (s.t === 'scale' && /^[1-5]$/.test(e.key)) {
    e.preventDefault();
    var sc = card.querySelector('.sc[data-v="' + e.key + '"]');
    if (sc) pickScale(s, sc);
    return;
  }
  if ((s.t === 'single' || s.t === 'multi') && /^[a-z]$/i.test(e.key)) {
    var k = LETTERS.indexOf(e.key.toUpperCase());
    var btns = card.querySelectorAll('.opt');
    if (k > -1 && btns[k]) { e.preventDefault(); s.t === 'single' ? pickOne(s, btns[k]) : toggle(s, btns[k]); }
  }
});

/* ---------- autosave ---------- */
var t1, t2;
function save(){
  clearTimeout(t1);
  t1 = setTimeout(function(){
    var d = {}; for (var k in A) d[k] = A[k];
    d.__i = idx;
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(err){ return; }
    savedP.classList.add('on');
    clearTimeout(t2);
    t2 = setTimeout(function(){ savedP.classList.remove('on'); }, 1600);
  }, 420);
}
(function restore(){
  var raw; try { raw = localStorage.getItem(KEY); } catch(err){ return; }
  if (!raw) return;
  var d; try { d = JSON.parse(raw); } catch(err){ return; }
  var i = d.__i; delete d.__i;
  A = d;
  if (typeof i === 'number') idx = Math.min(Math.max(i, 0), vis().length - 1);
})();

document.getElementById('clearBtn').addEventListener('click', function(){
  if (!confirm('Clear every answer and start over? This cannot be undone.')) return;
  try { localStorage.removeItem(KEY); } catch(err){}
  A = {}; idx = 0; dir = 1; render();
});

/* ---------- review + summary ---------- */
function rows(forPrint){
  var out = '', lastCh = 0;
  vis().forEach(function(s){
    if (!isQ(s)) return;
    var pairs = [];
    if (s.t === 'pair') {
      s.f.forEach(function(f){ if (A[f.n]) pairs.push([plain(f.l), A[f.n]]); });
    } else {
      var v = A[s.n];
      if (Array.isArray(v)) v = v.join(', ');
      if (v) pairs.push([plain(s.q), v]);
    }
    if (!pairs.length) return;
    if (s.ch !== lastCh) {
      lastCh = s.ch;
      out += forPrint ? '<h2>' + CH[s.ch-1] + '</h2>' : '<h4>' + CH[s.ch-1] + '</h4>';
    }
    pairs.forEach(function(p){
      out += '<div class="r"><span class="k">' + esc(p[0]) +
             (forPrint ? '' : '<button type="button" class="edit" data-i="' + S.indexOf(s) + '">Edit</button>') +
             '</span><span class="v">' + esc(p[1]) + '</span></div>';
    });
  });
  return out;
}
function reviewHTML(){
  var r = rows(false);
  return r || '<p class="none">Nothing answered yet. Use the arrow keys to go back through the questions.</p>';
}

function finish(){
  var nm = A.name ? ' &middot; ' + esc(A.name) : '';
  document.getElementById('psum').innerHTML =
    '<h1>Confidential Franchising Questionnaire</h1>' +
    '<p class="sub">JD Strategic Franchising &middot; Josh DuBois' + nm + ' &middot; ' +
    new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}) + '</p>' +
    rows(true);
  doneEl.classList.add('on');
  doneEl.focus();
}

/* ---------- submit ------------------------------------------------------
   Nothing is wired to a backend yet, by design. To send it for real, POST
   the answers object `A` from finish() and only then reveal the done screen:

     fetch('https://YOUR-ENDPOINT', {
       method:'POST',
       headers:{'Content-Type':'application/json'},
       body: JSON.stringify(A)
     }).then(...)

   Formspree, a GHL inbound webhook and a Zapier catch hook all take that
   shape unchanged.
   ----------------------------------------------------------------------- */

document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

render();
})();
</script>
